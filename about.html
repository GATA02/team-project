<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 소개</title>
  <link rel="stylesheet" href="./about.css">
  <script src="./about.js" defer></script>
</head>
<body>
  <main class="about-page">
    <a href="./page.html">← 메인으로 돌아가기</a>

    <h1>[팀명]을 소개합니다</h1>
    <p>우리 팀은 각자 맡은 페이지를 만들어 하나의 포트폴리오 사이트로 연결합니다.</p>

    <section>
      <h2>우리 팀이 모인 이유</h2>
      <p>[우리 팀이 함께 이 프로젝트를 하게 된 이유를 적는다.]</p>
    </section>

    <section>
      <h2>우리 팀의 목표</h2>
      <p>[우리 팀이 이번 프로젝트에서 만들고 싶은 결과를 적는다.]</p>
    </section>

    <section>
      <h2>우리의 활동 방향</h2>
      <p>[페이지를 어떻게 나눠 만들고 함께 확인하는지 적는다.]</p>

      <button id="work-button" type="button"
              aria-controls="work-list" aria-expanded="true" hidden>
        협업 과정 접기
      </button>

      <ol id="work-list">
        <li>각자 맡은 페이지를 만듭니다.</li>
        <li>서로의 변경 내용을 확인합니다.</li>
        <li>페이지를 하나로 연결하고 함께 테스트합니다.</li>
      </ol>
    </section>
  </main>
</body>
</html>
